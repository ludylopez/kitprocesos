<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuesta de mejora</title>
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --ink: #1d1d1b;
    --muted: #6b6a64;
    --line: #e4e2da;
    --accent: #1f6f5c;
    --accent-soft: #e3f1ec;
    --bad: #b4462f;
    --bad-soft: #fbe9e4;
    --warn: #8a6410;
    --warn-soft: #fbf1d9;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141513; --card: #1d1f1c; --ink: #ecebe6; --muted: #a3a29b; --line: #30332e;
      --accent: #5fc2a6; --accent-soft: #1d3530; --bad: #ef8b74; --bad-soft: #3a231d;
      --warn: #e9c46a; --warn-soft: #3a3220; --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141513; --card: #1d1f1c; --ink: #ecebe6; --muted: #a3a29b; --line: #30332e;
    --accent: #5fc2a6; --accent-soft: #1d3530; --bad: #ef8b74; --bad-soft: #3a231d;
    --warn: #e9c46a; --warn-soft: #3a3220; --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); line-height: 1.15; letter-spacing: -.02em; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
  h3 { font-size: 1.05rem; line-height: 1.3; }
  section { margin-top: 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .grid { display: grid; gap: 16px; }
  .grid > *, .tool > *, .moments > *, .rule > * { min-width: 0; }
  p, h1, h3, span, div { overflow-wrap: anywhere; }
  @media (min-width: 760px) { .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }

  /* Encabezado */
  header .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
  .pill.pendiente { background: var(--warn-soft); color: var(--warn); }
  .pill.aprobada { background: var(--accent-soft); color: var(--accent); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

  /* Meta */
  .meta { background: var(--accent); color: #fff; border: 0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .meta { background: var(--accent-soft); color: var(--ink); } }
  :root[data-theme="dark"] .meta { background: var(--accent-soft); color: var(--ink); }
  .meta .label { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; opacity: .8; }
  .meta .goal { font-size: clamp(1.2rem, 3.6vw, 1.6rem); line-height: 1.3; margin: 6px 0 16px; font-weight: 600; }
  .meta .measure { display: flex; gap: 10px; align-items: flex-start; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.25); }
  .meta .measure svg { flex: none; margin-top: 2px; }

  /* Antes / después */
  .ba .head span:last-child { text-align: right; }
  .ba .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .tag { flex: none; white-space: nowrap; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .tag.hoy { color: var(--bad); }
  .tag.nuevo { color: var(--accent); }
  .diagram { margin: 14px -4px; overflow-x: auto; min-height: 60px; }
  .diagram svg { max-width: none; height: auto; display: block; margin: 0 auto; }
  .diagram pre { font-size: .75rem; white-space: pre-wrap; color: var(--muted); }
  ul.items { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  ul.items li { display: flex; gap: 10px; align-items: flex-start; }
  ul.items li svg { flex: none; margin-top: 3px; }
  .bad svg { color: var(--bad); }
  .good svg { color: var(--accent); }
  .sub { font-size: .8rem; font-weight: 600; color: var(--muted); margin: 14px 0 8px; }

  /* Herramienta */
  .tool { display: grid; gap: 20px; }
  @media (min-width: 760px) { .tool { grid-template-columns: 1.4fr 1fr; align-items: center; } }
  .tool .name { font-size: 1.35rem; font-weight: 700; line-height: 1.25; margin: 4px 0 6px; }
  .ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; align-items: end; }
  .ladder div { border-radius: 8px; background: var(--line); color: var(--muted); font-size: .7rem; text-align: center; padding: 6px 4px; line-height: 1.2; }
  .ladder div:nth-child(1) { height: 44px; } .ladder div:nth-child(2) { height: 60px; }
  .ladder div:nth-child(3) { height: 76px; } .ladder div:nth-child(4) { height: 92px; }
  .ladder div { display: flex; align-items: flex-end; justify-content: center; }
  .ladder div.on { background: var(--accent); color: #fff; font-weight: 700; }
  .cost { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
  .cost .big { font-size: 1.6rem; font-weight: 700; line-height: 1; }
  .worth { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: .9rem; margin-top: 14px; }

  /* Momentos */
  .moments { display: grid; gap: 12px; }
  @media (min-width: 760px) { .moments { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); } }
  .moment { display: flex; gap: 14px; align-items: flex-start; }
  .moment .ico { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .moment .when { font-size: .8rem; color: var(--muted); }
  .moment .who { font-size: .75rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }

  /* Criterios */
  .rules { display: grid; gap: 10px; }
  .rule { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .rule .arrow { color: var(--accent); }
  .rule .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: block; }
  @media (max-width: 560px) { .rule { grid-template-columns: 1fr; gap: 4px; } .rule .arrow { transform: rotate(90deg); width: 18px; } }

  /* Pantallas */
  .screens { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .phone { border: 2px solid var(--line); border-radius: 22px; padding: 14px 12px 18px; background: var(--card); min-height: 190px; display: flex; flex-direction: column; gap: 8px; }
  .phone::before { content: ""; width: 36px; height: 4px; border-radius: 4px; background: var(--line); align-self: center; margin-bottom: 6px; }
  .phone .n { font-weight: 700; font-size: .95rem; line-height: 1.25; }
  .phone .d { font-size: .8rem; color: var(--muted); }
  .phone .bar { height: 8px; border-radius: 4px; background: var(--line); }
  .phone .btn { margin-top: auto; height: 28px; border-radius: 8px; background: var(--accent); opacity: .85; }

  /* Supuestos y después */
  .notes { display: grid; gap: 8px; }
  .note { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; display: flex; gap: 10px; }
  .note svg { color: var(--warn); flex: none; margin-top: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .875rem; background: var(--card); }

  /* Entrega */
  .deliver ol { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 6px; }
  .link { display: inline-block; margin-top: 10px; padding: 12px 18px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; word-break: break-all; }

  footer { margin-top: 40px; text-align: center; font-size: .8rem; color: var(--muted); }
  .empty { text-align: center; padding: 80px 16px; color: var(--muted); }

  @media print {
    body { background: #fff; }
    .card, .rule, .phone { box-shadow: none; break-inside: avoid; }
    main { padding: 0; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script src="datos.js"></script>
<script>
(function () {
  "use strict";
  var P = window.PROPUESTA;
  var app = document.getElementById("app");

  // ---------- utilidades ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function has(x) {
    if (x == null) return false;
    if (Array.isArray(x)) return x.length > 0;
    if (typeof x === "object") return Object.keys(x).some(function (k) { return has(x[k]); });
    return String(x).trim() !== "";
  }
  function list(arr) { return (arr || []).filter(has); }

  var I = {
    camara: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    voz: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    celular: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
    computadora: '<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/>',
    formulario: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    mensaje: '<path d="M4 5h16v11H9l-5 4z"/>',
    reloj: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',
    alerta: '<path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/>',
    documento: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
    codigo: '<path d="M4 6v12M7 6v12M10 6v12M14 6v12M16 6v12M20 6v12"/>',
    persona: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>',
    caja: '<path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/>',
    dinero: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
    grafica: '<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
    x: '<path d="M7 7l10 10M17 7 7 17"/>',
    check: '<path d="m5 12 4.5 4.5L19 7"/>',
    flecha: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    meta: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
    nota: '<circle cx="12" cy="12" r="8.5"/><path d="M12 8h.01M11 12h1v4h1"/>'
  };
  function icon(name, size) {
    var s = size || 20;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (I[name] || I.nota) + "</svg>";
  }
  function items(arr, cls, ico) {
    return '<ul class="items ' + cls + '">' + list(arr).map(function (t) {
      return "<li>" + icon(ico, 18) + "<span>" + esc(t) + "</span></li>";
    }).join("") + "</ul>";
  }
  function fecha(f) {
    if (!f) return "";
    var d = new Date(f + "T12:00:00");
    return isNaN(d) ? esc(f) : d.toLocaleDateString("es", { day: "numeric", month: "long", year: "numeric" });
  }

  if (!P || !has(P.proceso)) {
    app.innerHTML = '<div class="empty"><h1>Aún no hay propuesta</h1><p>Se mostrará aquí cuando termine la conversación con Claude.</p></div>';
    return;
  }
  document.title = (P.proceso || "Propuesta") + (P.negocio ? " · " + P.negocio : "");

  var h = [];
  var aprobada = P.estado === "aprobada";

  // ---------- encabezado ----------
  h.push('<header><div class="top"><span class="muted small">' + esc(P.negocio) + (P.fecha ? " · " + fecha(P.fecha) : "") + "</span>" +
    '<span class="pill ' + (aprobada ? "aprobada" : "pendiente") + '"><span class="dot"></span>' +
    (aprobada ? "Aprobada" + (P.aprobada_el ? " el " + fecha(P.aprobada_el) : "") : "Pendiente de revisar") + "</span></div>" +
    "<h1>" + esc(P.proceso) + "</h1></header>");

  // ---------- meta ----------
  var O = P.objetivo || {};
  if (has(O)) {
    h.push('<section><div class="card meta"><div class="label">Lo que queremos lograr</div>' +
      '<div class="goal">' + esc(O.meta) + "</div>" +
      (has(O.medida) ? '<div class="measure">' + icon("meta", 22) + "<div><strong>Sabremos que funciona cuando:</strong><br>" + esc(O.medida) + "</div></div>" : "") +
      "</div></section>");
  }

  // ---------- hoy / propuesta ----------
  var H = P.hoy || {}, N = P.propuesta || {};
  if (has(H) || has(N)) {
    h.push('<section><h2>Cómo cambia el proceso</h2><div class="grid">');
    if (has(H)) {
      h.push('<div class="card ba"><div class="head"><span class="tag hoy">Hoy</span>' +
        (has(H.tiempo) ? '<span class="small muted">' + icon("reloj", 14) + " " + esc(H.tiempo) + "</span>" : "") + "</div>" +
        (has(H.resumen) ? "<h3>" + esc(H.resumen) + "</h3>" : "") +
        (has(H.diagrama) ? '<div class="diagram" data-src="hoy"></div>' : "") +
        (list(H.problemas).length ? '<div class="sub">Dónde falla</div>' + items(H.problemas, "bad", "x") : "") +
        "</div>");
    }
    if (has(N)) {
      h.push('<div class="card ba"><div class="head"><span class="tag nuevo">Propuesta</span></div>' +
        (has(N.resumen) ? "<h3>" + esc(N.resumen) + "</h3>" : "") +
        (has(N.diagrama) ? '<div class="diagram" data-src="propuesta"></div>' : "") +
        (list(N.sin_tecnologia).length ? '<div class="sub">Mejoras de orden (sin tecnología)</div>' + items(N.sin_tecnologia, "good", "check") : "") +
        (list(N.automatizado).length ? '<div class="sub">Lo que se hace solo</div>' + items(N.automatizado, "good", "check") : "") +
        "</div>");
    }
    h.push("</div></section>");
  }

  // ---------- herramienta ----------
  var T = P.herramienta || {};
  if (has(T.nombre)) {
    var esc_ = typeof T.escalon === "number" ? T.escalon : -1;
    var niveles = ["Sin tecnología", "App que ya existe", "Hoja o página", "App a la medida"];
    h.push('<section><h2>Con qué se hace</h2><div class="card tool"><div>' +
      '<div class="small muted">Herramienta propuesta</div><div class="name">' + esc(T.nombre) + "</div>" +
      (has(T.por_que) ? "<p>" + esc(T.por_que) + "</p>" : "") +
      '<div class="cost">' +
      (has(T.costo_mensual) ? '<div><div class="small muted">Costo al mes</div><div class="big">' + esc(T.costo_mensual) + "</div></div>" : "") +
      "</div>" +
      (has(T.vale_la_pena) ? '<div class="worth"><strong>¿Vale la pena?</strong> ' + esc(T.vale_la_pena) + "</div>" : "") +
      (has(T.alternativa) ? '<p class="small muted" style="margin-top:10px">' + esc(T.alternativa) + "</p>" : "") +
      "</div>" +
      (esc_ >= 0 ? '<div><div class="small muted" style="margin-bottom:8px">Nivel de solución</div><div class="ladder">' +
        niveles.map(function (n, i) { return '<div class="' + (i === esc_ ? "on" : "") + '">' + n + "</div>"; }).join("") +
        '</div><p class="small muted" style="margin-top:8px">Siempre se empieza por lo más simple que resuelva el problema.</p></div>' : "") +
      "</div></section>");
  }

  // ---------- momentos ----------
  var M = list(P.momentos);
  if (M.length) {
    h.push('<section><h2>Cómo se va a usar</h2><div class="card moments">' + M.map(function (m) {
      return '<div class="moment"><div class="ico">' + icon(m.icono, 22) + "</div><div>" +
        (has(m.quien) ? '<div class="who">' + esc(m.quien) + "</div>" : "") +
        (has(m.cuando) ? '<div class="when">' + esc(m.cuando) + "</div>" : "") +
        "<div>" + esc(m.que) + "</div></div></div>";
    }).join("") + "</div></section>");
  }

  // ---------- pantallas ----------
  var S = list(P.pantallas);
  if (S.length) {
    h.push('<section><h2>Pantallas</h2><div class="screens">' + S.map(function (s) {
      return '<div class="phone"><div class="n">' + esc(s.nombre) + '</div><div class="d">' + esc(s.muestra) +
        '</div><div class="bar" style="width:80%"></div><div class="bar" style="width:55%"></div><div class="btn"></div></div>';
    }).join("") + "</div></section>");
  }

  // ---------- criterios ----------
  var C = list(P.criterios);
  if (C.length) {
    h.push('<section><h2>Cómo comprobaremos que funciona</h2><div class="rules">' + C.map(function (c) {
      return '<div class="rule"><div><span class="k">Cuando</span>' + esc(c.cuando) + '</div><div class="arrow">' + icon("flecha", 20) +
        '</div><div><span class="k">Entonces</span>' + esc(c.entonces) + "</div></div>";
    }).join("") + "</div></section>");
  }

  // ---------- supuestos y después ----------
  var A = list(P.supuestos), D = list(P.para_despues);
  if (A.length || D.length) {
    h.push('<section><div class="grid g2">');
    if (A.length) h.push('<div><h2>Por confirmar</h2><div class="notes">' + A.map(function (a) {
      return '<div class="note">' + icon("nota", 18) + "<span>" + esc(a) + "</span></div>";
    }).join("") + "</div></div>");
    if (D.length) h.push('<div><h2>Para después</h2><div class="chips">' + D.map(function (d) {
      return '<span class="chip">' + esc(d) + "</span>";
    }).join("") + "</div></div>");
    h.push("</div></section>");
  }

  // ---------- entrega ----------
  var E = P.entrega;
  if (E && has(E)) {
    h.push('<section><h2>Listo para usar</h2><div class="card deliver grid g2"><div>' +
      (has(E.enlace) ? '<a class="link" href="' + esc(E.enlace) + '" target="_blank" rel="noopener">Abrir ' + esc(E.enlace.replace(/^https?:\/\//, "")) + "</a>" : "") +
      (list(E.pasos).length ? '<div class="sub">Cómo se usa</div><ol>' + list(E.pasos).map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ol>" : "") +
      '</div><div class="grid">' +
      (has(E.costo) ? '<div><div class="small muted">Costo al mes</div><strong>' + esc(E.costo) + "</strong></div>" : "") +
      (has(E.cambios) ? '<div><div class="small muted">Para pedir cambios</div>' + esc(E.cambios) + "</div>" : "") +
      (has(E.si_falla) ? '<div><div class="small muted">Si algo falla</div>' + esc(E.si_falla) + "</div>" : "") +
      "</div></div></section>");
  }

  h.push("<footer>" + (aprobada ? "Propuesta aprobada" : "Revisa la propuesta y dile a Claude qué cambiar o si la apruebas.") + "</footer>");
  app.innerHTML = h.join("");

  // ---------- diagramas ----------
  var fuentes = { hoy: H.diagrama, propuesta: N.diagrama };
  var nodos = Array.prototype.slice.call(document.querySelectorAll(".diagram[data-src]"));
  if (!nodos.length) return;

  function fallback(el, src, msg) {
    el.innerHTML = '<p class="small muted">' + esc(msg) + "</p><pre>" + esc(src) + "</pre>";
  }
  function oscuro() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js";
  s.onerror = function () {
    nodos.forEach(function (el) { fallback(el, fuentes[el.getAttribute("data-src")], "No se pudo cargar el dibujo (¿sin internet?). Este es el texto del diagrama:"); });
  };
  s.onload = function () {
    var dark = oscuro();
    window.mermaid.initialize({
      startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "neutral",
      flowchart: { htmlLabels: true, curve: "basis", useMaxWidth: false, nodeSpacing: 30, rankSpacing: 36 },
      themeVariables: { fontFamily: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif", fontSize: "15px" }
    });
    var clases = dark
      ? "\nclassDef problema fill:#3a231d,stroke:#ef8b74,color:#ecebe6,stroke-width:2px\nclassDef nuevo fill:#1d3530,stroke:#5fc2a6,color:#ecebe6,stroke-width:2px"
      : "\nclassDef problema fill:#fbe9e4,stroke:#b4462f,color:#1d1d1b,stroke-width:2px\nclassDef nuevo fill:#e3f1ec,stroke:#1f6f5c,color:#1d1d1b,stroke-width:2px";
    nodos.forEach(function (el, i) {
      var src = String(fuentes[el.getAttribute("data-src")] || "").trim();
      window.mermaid.render("dg" + i, src + clases).then(function (r) {
        el.innerHTML = r.svg;
      }).catch(function () {
        var tmp = document.getElementById("ddg" + i); if (tmp) tmp.remove();
        fallback(el, src, "El diagrama tiene un error de escritura. Pídele a Claude que lo corrija.");
      });
    });
  };
  document.head.appendChild(s);
})();
</script>
